<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Song Agent unified runtime</title>
  <desc id="desc">Feishu, OpenAI API, business REST API and scheduler converge on one request router and safe execution runtime</desc>
  <defs>
    <linearGradient id="background" x1="75" y1="20" x2="1125" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071525"/>
      <stop offset="0.52" stop-color="#0B1730"/>
      <stop offset="1" stop-color="#17113A"/>
    </linearGradient>
    <linearGradient id="router" x1="384" y1="179" x2="816" y2="277" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2"/>
      <stop offset="0.52" stop-color="#3B68F5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="safe" x1="194" y1="436" x2="1006" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102D43"/>
      <stop offset="0.48" stop-color="#162B57"/>
      <stop offset="1" stop-color="#30205B"/>
    </linearGradient>
    <filter id="glow" x="330" y="135" width="540" height="186" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#4169E1" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8V0Z" fill="#6686BB"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="558" rx="32" fill="url(#background)" stroke="#24395F" stroke-width="2"/>
  <circle cx="1055" cy="74" r="146" fill="#5B38D6" fill-opacity="0.09"/>
  <circle cx="118" cy="470" r="174" fill="#06B6D4" fill-opacity="0.06"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="600" y="49" text-anchor="middle" fill="#8FA3C5" font-size="14" font-weight="700" letter-spacing="3">CHOOSE YOUR ENTRY</text>

    <g>
      <rect x="60" y="72" width="240" height="82" rx="18" fill="#101F38" stroke="#29436C"/>
      <circle cx="98" cy="113" r="20" fill="#3370FF"/>
      <path d="M88 106H108M88 113H103M88 120H99" stroke="white" stroke-width="3" stroke-linecap="round"/>
      <text x="132" y="108" fill="#F4F7FF" font-size="18" font-weight="700">飞书会话</text>
      <text x="132" y="132" fill="#8FA3C5" font-size="13">消息 · 卡片 · 附件</text>
    </g>

    <g>
      <rect x="340" y="72" width="240" height="82" rx="18" fill="#101F38" stroke="#29436C"/>
      <circle cx="378" cy="113" r="20" fill="#7256E8"/>
      <path d="M368 113H388M378 103V123" stroke="white" stroke-width="3" stroke-linecap="round"/>
      <text x="412" y="108" fill="#F4F7FF" font-size="18" font-weight="700">OpenAI API</text>
      <text x="412" y="132" fill="#8FA3C5" font-size="13">Chat Completions</text>
    </g>

    <g>
      <rect x="620" y="72" width="240" height="82" rx="18" fill="#101F38" stroke="#29436C"/>
      <circle cx="658" cy="113" r="20" fill="#0891B2"/>
      <path d="M649 106L641 113L649 120M667 106L675 113L667 120" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="692" y="108" fill="#F4F7FF" font-size="18" font-weight="700">业务 REST</text>
      <text x="692" y="132" fill="#8FA3C5" font-size="13">类型化确定性入口</text>
    </g>

    <g>
      <rect x="900" y="72" width="240" height="82" rx="18" fill="#101F38" stroke="#29436C"/>
      <circle cx="938" cy="113" r="20" fill="#0F9F81"/>
      <circle cx="938" cy="113" r="10" stroke="white" stroke-width="2.5"/>
      <path d="M938 106V113L944 117" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      <text x="972" y="108" fill="#F4F7FF" font-size="18" font-weight="700">Scheduler</text>
      <text x="972" y="132" fill="#8FA3C5" font-size="13">计划 · 提醒 · 广播</text>
    </g>

    <path d="M180 154V178H492" stroke="#6686BB" stroke-width="2"/>
    <path d="M460 154V178H548" stroke="#6686BB" stroke-width="2"/>
    <path d="M740 154V178H652" stroke="#6686BB" stroke-width="2"/>
    <path d="M1020 154V178H708" stroke="#6686BB" stroke-width="2"/>
    <path d="M600 178V195" stroke="#6686BB" stroke-width="2" marker-end="url(#arrow)"/>

    <g filter="url(#glow)">
      <rect x="384" y="196" width="432" height="98" rx="25" fill="url(#router)"/>
      <text x="600" y="235" text-anchor="middle" fill="white" font-size="26" font-weight="750">Request Router</text>
      <text x="600" y="264" text-anchor="middle" fill="#DCE8FF" font-size="14" font-weight="500">身份解析 · 结构化意图 · 上下文编排 · 策略检查</text>
    </g>

    <path d="M600 294V321H360V339" stroke="#6686BB" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M600 294V321H840V339" stroke="#6686BB" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="194" y="340" width="332" height="78" rx="20" fill="#112842" stroke="#1E7892"/>
      <text x="360" y="373" text-anchor="middle" fill="#E7FAFF" font-size="19" font-weight="700">确定性应用服务</text>
      <text x="360" y="398" text-anchor="middle" fill="#88B8C6" font-size="13">Calendar · Task · Reminder · Executor</text>
    </g>
    <g>
      <rect x="674" y="340" width="332" height="78" rx="20" fill="#211D46" stroke="#6751B8"/>
      <text x="840" y="373" text-anchor="middle" fill="#F2EDFF" font-size="19" font-weight="700">有限步 Agent Runtime</text>
      <text x="840" y="398" text-anchor="middle" fill="#ADA0D5" font-size="13">Conversation · Document · Search · Tools</text>
    </g>

    <path d="M360 418V441" stroke="#6686BB" stroke-width="2"/>
    <path d="M840 418V441" stroke="#6686BB" stroke-width="2"/>
    <rect x="194" y="442" width="812" height="76" rx="22" fill="url(#safe)" stroke="#38517A"/>
    <text x="600" y="475" text-anchor="middle" fill="#F1F5FF" font-size="18" font-weight="700">统一安全与持久化层</text>
    <text x="600" y="499" text-anchor="middle" fill="#9FB1CF" font-size="13">OAuth · PendingAction · Outbox · Reconciliation · Audit · SQLite</text>
  </g>
</svg>
