[project]
name = "song-agent"
version = "0.3.0"
description = "A multi-user Feishu planning, reminder, and document agent with isolated OAuth."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.21,<1",
  "apscheduler>=3.11,<4",
  "cryptography>=46,<51",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "lark-oapi>=1.4.24,<2",
  "mcp>=1.13,<2",
  "mineru-vl-utils>=1.0.5,<2",
  "openai>=2.48.0",
  "pypdfium2>=5.11,<6",
  "pydantic-settings>=2.10,<3",
  "search-engine-tool-mcp>=0.4.3,<1",
  "tenacity>=9.1.4",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
song-agent = "song_agent.__main__:main"
song-agent-rotate-keys = "song_agent.cli.rotate_keys:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["song_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
